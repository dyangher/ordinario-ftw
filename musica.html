<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Música - Mis bandas favoritas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="window-container">
    <div class="title-bar">
        <span class="title-text">Música - Bandas que me gustan</span>
        <div class="window-controls">
            <button class="btn">-</button>
            <button class="btn max">□</button>
            <button class="btn close">X</button>
        </div>
    </div>
    <div class="nav-bar">
        <a href="index.html"> Inicio</a>
        <a href="musica.html"> Música</a>
        <a href="juegos.html"> Juegos</a>
        <a href="dyangher.html"> Dyangher</a>
        <a href="documentacion.html">Documentación</a>


    </div>
    <div class="content">
        <!-- Botones de ordenamiento dinámico -->
        <div class="controles" style="margin-bottom: 1.5rem;">
            <button id="orden-asc">▲ Ordenar A-Z</button>
            <button id="orden-desc">▼ Ordenar Z-A</button>
            <button id="orden-random">🎲 Orden aleatorio</button>
        </div>

        <!-- Grid de tarjetas (cargado por script.js) -->
        <div class="music-grid"></div>
    </div>
    <div class="footer">
        <details>
            Los datos se cargan desde datos.xml. DYANGHER WAS HERE
        </details>
    </div>
</div>

<script src="script.js"></script>
<script>
    // Script para ordenar las tarjetas dinámicamente
    (function() {
        // Esperar a que script.js haya cargado las tarjetas
        setTimeout(() => {
            const grid = document.querySelector('.music-grid');
            if (!grid) return;

            // Función para obtener todas las tarjetas actuales como array
            function obtenerTarjetas() {
                return Array.from(grid.children);
            }

            // Función para renderizar las tarjetas en nuevo orden
            function renderizarTarjetas(tarjetas) {
                grid.innerHTML = '';
                tarjetas.forEach(card => grid.appendChild(card));
            }

            // Ordenar por nombre (A-Z)
            document.getElementById('orden-asc').addEventListener('click', () => {
                let tarjetas = obtenerTarjetas();
                tarjetas.sort((a, b) => {
                    let nombreA = a.querySelector('h3')?.textContent || '';
                    let nombreB = b.querySelector('h3')?.textContent || '';
                    return nombreA.localeCompare(nombreB);
                });
                renderizarTarjetas(tarjetas);
            });

            // Ordenar por nombre (Z-A)
            document.getElementById('orden-desc').addEventListener('click', () => {
                let tarjetas = obtenerTarjetas();
                tarjetas.sort((a, b) => {
                    let nombreA = a.querySelector('h3')?.textContent || '';
                    let nombreB = b.querySelector('h3')?.textContent || '';
                    return nombreB.localeCompare(nombreA);
                });
                renderizarTarjetas(tarjetas);
            });

            // Orden aleatorio
            document.getElementById('orden-random').addEventListener('click', () => {
                let tarjetas = obtenerTarjetas();
                for (let i = tarjetas.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [tarjetas[i], tarjetas[j]] = [tarjetas[j], tarjetas[i]];
                }
                renderizarTarjetas(tarjetas);
            });
        }, 500); // Pequeño retraso para asegurar que script.js ya cargó las tarjetas
    })();
</script>
</body>
</html>
